name: Build Aadwik AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./YOUR_SUBFOLDER
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: ./YOUR_SUBFOLDER
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AadwikAI-Release-APK
          path: ./YOUR_SUBFOLDER/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
